name: Publish Packages & VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Package Projects
        run: dotnet pack --configuration Release --output nupkg

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: choshinyoung

      - name: Publish to NuGet
        run: dotnet nuget push nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-vscode-extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Build Toast Solution
        run: dotnet build --configuration Release

      - name: Install Extension Dependencies
        working-directory: ./editors/vscode
        run: npm ci

      - name: Publish to VS Code Marketplace
        working-directory: ./editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat $VSCE_PAT
